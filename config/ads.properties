# =====================================================================
#  Configuración del sistema ADS (Cómputo Distribuido — Tercer Parcial)
#  Todas las claves son opcionales: si faltan se usan estos mismos valores.
# =====================================================================

# Nodos del Campo de Datos conocidos de antemano (id@host:puerto).
# Para varias máquinas, reemplace localhost por la IP de cada una y arranque
# cada nodo con --host <su IP>. Se pueden agregar nodos en ejecución: se descubren solos.
nodos=N1@localhost:5001,N2@localhost:5002,N3@localhost:5003,N4@localhost:5004

# Repositorio de microservicios (genes) en disco y carpeta de bitácoras
genes.dir=genes
logs.dir=logs

# ---- Difusión ----
# Saltos máximos de un mensaje (red de seguridad contra ciclos; la defensa principal
# es la caché de identificadores ya vistos en cada nodo)
broadcast.ttl=8

# ---- Latidos y detección de fallas ----
latido.intervalo.ms=1500
# sin latidos durante este tiempo => la célula se considera muerta
latido.timeout.ms=5000
# tras CELULA_DESCONECTADA se espera este tiempo a que la célula reaparezca en otro nodo
desconexion.gracia.ms=2000

# ---- Foliado / eventos ----
# Min. # de ACK para aceptar un evento (se puede cambiar en cada calculadora)
evento.minAck=2
# espera máxima de ACK antes de decidir
evento.timeoutAck.ms=1000
# espera máxima del RESULTADO de la célula ejecutora antes de reasignar
evento.timeoutResultado.ms=2500
# reasignaciones permitidas si la ejecutora no responde
evento.reintentos=2

# ---- Autorrecuperación (clonación) ----
clonacion.habilitada=true
# espera tras detectar la falla antes de que actúe la primera candidata (confirma que no regresa)
clonacion.confirmacion.ms=2500
# retraso adicional por cada posición en el orden de candidatas (relevo si la primera no actúa)
clonacion.paso.ms=3000
# espera para detectar reservas rivales antes de crear el proceso
clonacion.espera.ms=400
# vigencia de una reserva: si el clon no aparece, la deuda vuelve a quedar pendiente
clonacion.reserva.ms=20000
# tiempo mínimo entre dos clonaciones de una misma célula
clonacion.enfriamiento.ms=8000
# una célula recién nacida no puede clonar durante este tiempo
clonacion.maduracion.ms=6000
# límites anti-cáncer
clonacion.maxGeneracion=5
clonacion.maxInstanciasPorServicio=8
clonacion.maxCelulas=40
clonacion.maxIntentos=3
